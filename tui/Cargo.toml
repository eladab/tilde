[package]
name = "tilde-tui"
version = "0.3.0"
edition = "2021"
description = "Terminal interface for the Tilde browser"
license = "MIT"
repository = "https://github.com/eladab/tilde"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
