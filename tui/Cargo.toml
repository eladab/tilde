[package]
name = "tilde-tui"
version = "1.1.0"
edition = "2021"
description = "Terminal interface for the Tilde browser"
license = "MIT"
repository = "https://github.com/eladab/tilde"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
# Bodies are shown with their keys in the order the server sent them.
serde_json = { version = "1", features = ["preserve_order"] }
unicode-width = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
