name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Versions
        run: sw_vers && swift --version && cargo --version
      - name: Unit tests
        run: ./scripts/test.sh
      - name: Bundle
        run: ./scripts/bundle.sh
        env:
          TILDE_SIGN_IDENTITY: "-"
